<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <meta name="theme-color" content="#F7F4ED" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Tandem Arcade is a no-sign-up game room for friends across Web and iPhone, with adaptive AI whenever you want to play solo." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Tandem Arcade" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:title" content="Tandem Arcade · Play Together" />
    <meta property="og:description" content="Twenty-eight competitive and cooperative games for friends across Web and iPhone, plus instant solo play with adaptive AI." />
    <meta property="og:url" content="https://duo-arcade.yimgyan.workers.dev" />
    <title>Tandem Arcade · Two-Player &amp; AI Games</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        overflow: hidden;
        background: #F7F4ED;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      :where(button, input, textarea, select, a, [role="button"], [role="switch"], [role="radio"]):focus-visible {
        outline: 3px solid #4142B8 !important;
        outline-offset: 3px;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <noscript>Tandem Arcade requires JavaScript to run.</noscript>
    <div id="root"></div>
  </body>
</html>
